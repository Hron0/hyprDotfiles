# https://wiki.hyprland.org/Configuring/Window-Rules/

# Bookmarks window in zen browser
windowrule {
  name = windowrule-1
  float = on
  match:title = Library
  match:class = zen-browser
}


# Thunar
windowrule {
  name = windowrule-2
  float = on
  match:title = ^(File Operation Progress)$
  match:class = thunar
}

windowrule {
  name = windowrule-3
  float = on
  stay_focused = on
  match:title = ^(Rename)(.*)$
  match:class = thunar
}


windowrule {
  name = windowrule-4
  float = on
  match:title = ^(Font Manager)$
}

windowrule {
  name = windowrule-5
  float = on
  size = 900 600
  move = ((monitor_w*0.5)) ((monitor_h*0.15))
  match:title = ^(DevToolsApp)$
}

windowrule {
  name = windowrule-6
  float = on
  match:title = ^(Volume Control)$
  size = 1100 500
}

windowrule {
  name = windowrule-7
  float = on
  match:title = ^(Qalculate!)$
}


windowrule {
  name = windowrule-8
  float = on
  match:class = blueman-manager
}

windowrule {
  name = windowrule-9
  float = on
  match:class = blueman-services
}

windowrule {
  name = windowrule-10
  float = on
  size = 900 500
  match:class = nwg-look
}

windowrule {
  name = windowrule-11
  float = on
  size = 1000 500
  match:class = rog-control-center
}

windowrule {
  name = windowrule-12
  float = on
  match:class = org.qbittorrent.qBittorrent
}

windowrule {
  name = windowrule-13
  float = on
  match:class = kvantummanager
}

windowrule {
  name = windowrule-14
  float = on
  stay_focused = on
  match:class = xfce-polkit
}

windowrule {
  name = windowrule-15
  float = on
  size = 900 600
  match:class = org.polymc.PolyMC
}

windowrule {
  name = windowrule-16
  float = on
  match:class = engrampa
}

windowrule {
  name = windowrule-17
  float = on
  match:class = nm-connection-editor
}

windowrule {
  name = windowrule-18
  float = on
  match:class = spotify
}

windowrule {
  name = windowrule-19
  float = on
  persistent_size = on
  match:class = Notion
}

windowrule {
  name = windowrule-20
  float = on
  match:class = system-config-printer
}

windowrule {
  name = windowrule-21
  float = on
  match:class = net.lutris.Lutris
}

windowrule {
  name = windowrule-22
  float = on
  match:class = org.bleachbit.BleachBit
}

windowrule {
  name = windowrule-23
  float = on
  match:class = vlc
}

windowrule {
  name = windowrule-24
  float = on
  match:class = exo-desktop-item-edit
}

windowrule {
  name = windowrule-25
  float = on
  match:class = xdg-desktop-portal-gtk
}

windowrule {
  name = windowrule-26
  float = on
  no_anim = on
  match:class = flameshot
}

windowrule {
  name = windowrule-27
  float = on
  match:class = org.gnome.eog
}

windowrule {
  name = windowrule-28
  float = on
  persistent_size = on
  match:class = qt6ct
}

windowrule {
  name = windowrule-29
  float = on
  size = 900 500
  match:class = org.gnome.seahorse.Application
}


# Arduino ide file manager menu (native wayland)
windowrule {
  name = windowrule-30
  float = on
  match:class = electron
  match:title = (^$)
}

windowrule {
  name = windowrule-31
  float = on
  match:class = electron
  match:title = (Save sketch folder as...)
}


# Winetricks
windowrule {
  name = windowrule-32
  float = on
  match:class = zenity
  match:title = ^(Winetricks -)(.*)
}

windowrule {
  name = windowrule-33
  float = on
  match:class = zenity
  match:title = winetricks
}


# Telegram
# windowrule = fullscreen, class:org.telegram.desktop
windowrule {
  name = windowrule-34
  float = on
  match:class = org.telegram.desktop
  match:title = ^(Media viewer)
}


# Stayfocused
windowrule {
  name = windowrule-35
  stay_focused = on
  match:title = ^(Rename device)$
  match:class = blueman-manager
}



windowrule {
  name = windowrule-36
  float = on
  match:class = thunar
}

windowrule {
  name = windowrule-37
  stay_focused = on
  match:title = ^(Create Document from)(.*)$
  match:class = thunar
}

windowrule {
  name = windowrule-38
  stay_focused = on
  match:title = ^(New)(.*)(...)$
  match:class = thunar
}

windowrule {
  name = windowrule-39
  stay_focused = on
  match:title = ^(Create New Folder)$
  match:class = thunar
}


# windowrule=stayfocused,title:^(Open Workspace from File)$,class:codium
# windowrule=stayfocused,title:^(Open Folder)$,class:codium
# windowrule=stayfocused,title:^(Open File)$,class:codium
# windowrule=stayfocused,title:^(Add Folder to Workspace)$,class:codium

windowrule {
  name = windowrule-40
  size = 1340 750
  match:title = ^(Lutris)$
  match:class = net.lutris.Lutris
}



# Alacritty
windowrule {
  name = windowrule-41
  opacity = 0.9 0.8
  border_size = 2 override
  persistent_size = on
  match:class = Alacritty
}


windowrule {
  name = windowrule-42
  size = 390 220
  move = ((monitor_w*0.79)) ((monitor_h*0.06))
  float = on
  no_initial_focus = on
  pin = on
  match:title = Picture-in-Picture
  match:class = zen-browser
}


# Games
windowrule {
  name = windowrule-43
  fullscreen = on
  match:title = ^(Forza Horizon 4)
  match:class = ^(steam_app_)(.*)$
}

windowrule {
  name = windowrule-44
  fullscreen = on
  match:title = ^(Geometry Dash)
  match:class = ^(steam_app_)(.*)$
}

windowrule {
  name = windowrule-45
  fullscreen = on
  match:title = ^(House Flipper 2)
  match:class = ^(steam_app_)(.*)$
}


# Tags
windowrule {
  name = windowrule-46
  float = on
  match:tag = float
}

windowrule {
  name = windowrule-47
  opacity = 1 override
  match:tag = opaque
}

windowrule {
  name = windowrule-48
  border_size = 2 override
  match:tag = bordered
}


# Misc
windowrule {
  name = windowrule-49
  persistent_size = on
  match:class = io.missioncenter.MissionCenter
}


# Layers
layerrule {
  name = layerrule-1
  animation = slide right
  match:namespace = swaync-control-center
}

layerrule {
  name = layerrule-2
  animation = slide
  match:namespace = rofi
}


layerrule {
  name = layerrule-3
  no_anim = on
  match:namespace = swww-daemon
}

layerrule {
  name = layerrule-4
  no_anim = on
  match:namespace = selection
}

