# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

monitor= DP-2,2560x1440@60,1080x0,1
monitor= HDMI-A-1, 1920x1080@60, 0x0, 1, transform,1

# ==--==--==--==--==--==--==--==--==--==--==--== #

workspace = 1, persistent:true, monitor:DP-2
workspace = 2, persistent:true, monitor:DP-2
workspace = 3, persistent:true, monitor:DP-2
workspace = 4, persistent:true, monitor:DP-2
workspace = 5, persistent:true, monitor:DP-2
workspace = 6, persistent:true, monitor:DP-2

workspace = 7, persistent:true, monitor:HDMI-A-1
workspace = 8, persistent:true, monitor:HDMI-A-1
workspace = 9, persistent:true, monitor:HDMI-A-1

$CONFIGS = ~/.config/hypr/configs

source = $CONFIGS/environ.conf
source = $CONFIGS/exec.conf
source = $CONFIGS/binds.conf
source = $CONFIGS/settings.conf
source = $CONFIGS/animations.conf
source = $CONFIGS/rules.conf

source = ./dms/cursor.conf
